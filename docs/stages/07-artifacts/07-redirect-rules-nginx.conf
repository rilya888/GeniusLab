# Redirect rules template for source domains -> canonical geniuslab.it

server {
    listen 80;
    server_name avatech.info www.avatech.info;
    return 301 https://geniuslab.it$request_uri;
}

server {
    listen 80;
    server_name assistenza-macbook.it www.assistenza-macbook.it;

    location = /service/riparazione-macbook/ { return 301 https://geniuslab.it/servizi/riparazione-macbook; }
    location = /service/data-recovery/ { return 301 https://geniuslab.it/servizi/data-recovery; }
    location = /service/display-macbook/ { return 301 https://geniuslab.it/servizi/display-macbook; }
    location = /contattaci/ { return 301 https://geniuslab.it/contatti; }
    location / { return 301 https://geniuslab.it$request_uri; }
}

server {
    listen 80;
    server_name apple-assistenza.it www.apple-assistenza.it;

    location = /contatti/ { return 301 https://geniuslab.it/contatti; }
    location = /recensioni/ { return 301 https://geniuslab.it/recensioni; }
    location = /avatech-chi-siamo/ { return 301 https://geniuslab.it/chi-siamo; }
    location / { return 301 https://geniuslab.it$request_uri; }
}
